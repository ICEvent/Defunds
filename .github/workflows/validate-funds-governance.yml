name: Validate funds governance branch

on:
  push:
    branches:
      - feat/funds-governance-ux
    paths:
      - src/backend/group/lib.mo
      - src/backend/main.mo
      - src/frontend/src/routes/funds/**
      - .github/workflows/validate-funds-governance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dfinity/setup-dfx@main

      - name: Install dependencies
        run: npm ci

      - name: Check backend Motoko
        run: |
          # The repository currently configures `mops sources` but has no mops.toml.
          # Remove only that stale packtool setting in the disposable CI workspace
          # so this job can validate the Motoko source itself.
          jq 'del(.defaults.build.packtool)' dfx.json > /tmp/dfx.json
          mv /tmp/dfx.json dfx.json
          dfx build backend --check

      - name: Build frontend
        run: npm run build --workspace=frontend --ignore-scripts
