name: Validate funds governance branch

on:
  push:
    branches:
      - feat/funds-governance-ux
    paths:
      - src/backend/group/lib.mo
      - src/backend/main.mo
      - src/frontend/src/routes/funds/**
      - src/frontend/src/lib/components/Profile/GroupPanel.svelte
      - .github/workflows/validate-funds-governance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dfinity/setup-dfx@main

      - name: Install dependencies
        run: npm ci

      - name: Check backend Motoko
        run: |
          # The repository currently configures `mops sources` but has no mops.toml.
          # Remove only that stale packtool setting in this disposable CI workspace.
          jq 'del(.defaults.build.packtool)' dfx.json > /tmp/dfx.json
          mv /tmp/dfx.json dfx.json
          dfx build backend --check

      - name: Compile changed Svelte components
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from 'svelte/compiler';

          const files = [
            'src/frontend/src/routes/funds/+page.svelte',
            'src/frontend/src/routes/funds/[id]/+page.svelte',
            'src/frontend/src/lib/components/Profile/GroupPanel.svelte',
          ];

          let blockingWarnings = 0;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = compile(source, { filename: file, generate: 'ssr' });
            const a11y = result.warnings.filter((warning) => warning.code?.startsWith('a11y'));
            console.log(`${file}: compiled; ${a11y.length} accessibility warning(s)`);
            for (const warning of a11y) {
              console.error(`${warning.code}: ${warning.message}`);
            }
            blockingWarnings += a11y.length;
          }

          if (blockingWarnings > 0) {
            console.error(`Changed Funds components contain ${blockingWarnings} accessibility warning(s).`);
            process.exit(1);
          }
          NODE
