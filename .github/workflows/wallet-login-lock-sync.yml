# Temporary PR-branch helper. Remove after the lockfile is synchronized.
name: Wallet login dependency lock sync
on:
  push:
    branches:
      - feat/wallet-login-plug-oisy-20261116

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to PR branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(auth): synchronize signer SDK npm lockfile"
            git push origin HEAD:feat/wallet-login-plug-oisy-20261116
          fi
