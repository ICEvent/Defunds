name: Personal Loan checks

on:
  pull_request:
    paths:
      - "src/personal_loan/**"
      - "test/PersonalLoanLedger.test.mo"
      - "dfx.json"
      - ".github/workflows/personal-loan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motoko:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dfx 0.30.1
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: '0.30.1'
      - name: Validate canister build
        run: dfx build personal_loan --check
      - name: Run deterministic ledger fixtures
        run: |
          CACHE="$(dfx cache show)"
          "$CACHE/moc" -r --package base "$CACHE/base" test/PersonalLoanLedger.test.mo
