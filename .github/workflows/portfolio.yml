name: Portfolio checks
on:
  pull_request:
    paths:
      - 'src/backend/**'
      - 'src/frontend/src/lib/asset-catalog/**'
      - 'src/frontend/src/lib/components/GlobalAssetCatalog.svelte'
      - 'src/frontend/src/routes/assets/**'
      - 'test/AssetCatalog.test.mo'
      - 'test/asset-catalog*'
      - 'test/asset-catalog-browser/**'
      - 'src/frontend/src/lib/components/FundInvestments.svelte'
      - 'src/frontend/src/lib/components/Investment*.svelte'
      - 'test/InvestmentStrategy.test.mo'
      - 'test/InvestmentReviews.test.mo'
      - 'test/investment*'
      - 'test/Investments.test.mo'
      - 'src/frontend/src/lib/portfolio/**'
      - 'src/frontend/src/lib/components/GroupPortfolio.svelte'
      - 'test/PortfolioLedger.test.mo'
      - 'test/PortfolioLocations.test.mo'
      - 'test/portfolio-locations.test.mjs'
      - 'src/frontend/src/lib/components/LocationPortfolio.svelte'
      - 'test/FundCurrencies.test.mo'
      - 'test/Icrc3DonationProof.test.mo'
      - 'test/icrc-donation-e2e.sh'
      - 'test/fixtures/**'
      - 'src/frontend/src/lib/components/FundCurrencies.svelte'
      - 'src/frontend/src/lib/portfolio/chain-assets.js'
      - 'test/chain-assets.test.mjs'
      - 'test/location-chain-browser.test.mjs'
      - 'src/frontend/src/lib/components/LocationChainAssets.svelte'
      - 'test/portfolio-amount.test.mjs'
      - 'test/portfolio-e2e.sh'
      - 'test/portfolio-browser/**'
      - 'test/portfolio-browser.test.mjs'
      - 'test/asset-workflow-browser.test.mjs'
      - 'src/frontend/src/routes/funds/[id]/+page.svelte'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: '0.30.1'
      - name: Use SDK base library
        run: |
          jq 'del(.defaults.build.packtool)' dfx.json > dfx.ci.json
          mv dfx.ci.json dfx.json
      - name: Compile backend
        run: dfx build backend --check
      - name: Checkout pinned production base 0.11.2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dfinity/motoko-base
          ref: cb79b657d9156f44bf7d195331af3aa88953467a # moc-0.11.2
          path: .ci/base-0.11.2
          persist-credentials: false
      - name: Compile and test catalog against production base 0.11.2
        run: |
          CACHE="$(dfx cache show)"
          "$CACHE/moc" --check --package base .ci/base-0.11.2/src src/backend/main.mo
          "$CACHE/moc" -r --package base .ci/base-0.11.2/src test/AssetCatalog.test.mo
      - name: Test ledger transitions and authorization policy
        run: |
          CACHE="$(dfx cache show)"
          "$CACHE/moc" -r --package base "$CACHE/base" test/AssetCatalog.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/Investments.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/InvestmentStrategy.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/InvestmentReviews.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/PortfolioLedger.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/FundCurrencies.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/Icrc3DonationProof.test.mo
          "$CACHE/moc" -r --package base "$CACHE/base" test/PortfolioLocations.test.mo
      - name: Test decimal precision and valuation summaries
        run: node --test test/asset-catalog.test.mjs test/investment-analysis.test.mjs test/investment.test.mjs test/portfolio-amount.test.mjs test/portfolio-locations.test.mjs
      - name: Test production Portfolio APIs and populated upgrade
        run: bash test/portfolio-e2e.sh
      - name: Verify ICRC donations and upgrade replay protection
        run: bash test/icrc-donation-e2e.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies and browser test runtime
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
          command -v google-chrome
      - name: Verify on-chain snapshot parsing and pagination
        run: node --test test/chain-assets.test.mjs
      - name: Test actual Portfolio component on desktop and mobile
        env:
          PORTFOLIO_SCREENSHOTS: /tmp/portfolio-browser-screenshots
        run: |
          PORTFOLIO_CHROMIUM="$(command -v google-chrome)" node test/portfolio-browser.test.mjs
          PORTFOLIO_CHROMIUM="$(command -v google-chrome)" node test/investment-browser.test.mjs
          PORTFOLIO_CHROMIUM="$(command -v google-chrome)" node test/asset-workflow-browser.test.mjs
          PORTFOLIO_CHROMIUM="$(command -v google-chrome)" node test/asset-catalog-browser.test.mjs
          PORTFOLIO_CHROMIUM="$(command -v google-chrome)" node test/location-chain-browser.test.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-screenshots
          path: /tmp/portfolio-browser-screenshots
          if-no-files-found: ignore
